<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Eventia</title>
  <meta name="theme-color" content="#15181b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E8601C'/%3E%3Cpath d='M10 9h12v3H13.5v2.5H21v3h-7.5V20H22v3H10z' fill='%230e1012'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="login">

    <aside class="login-aside">
      <a href="login.html" class="brand" aria-label="Eventia">
        <span class="brand-mark" aria-hidden="true">E</span>Eventia
      </a>
      <p class="login-claim">Tus eventos, sin caos. Tus datos, con claridad.</p>
      <small>© <span id="year">2026</span> Eventia</small>
    </aside>

    <main class="login-main">
      <div class="login-card">
        <h1>Bienvenido de nuevo</h1>
        <p class="sub">Accede a tu panel de eventos.</p>

        <div id="alerta" aria-live="polite"></div>

        <form id="formLogin" class="form" novalidate>
          <div class="field">
            <label for="usuario">Nombre de usuario</label>
            <input class="input" id="usuario" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" aria-describedby="username-error" placeholder="tu_usuario">
            <p class="error" id="username-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="clave">Contraseña</label>
            <div class="field-row">
              <input class="input input--pw" id="clave" name="password" type="password" autocomplete="current-password" required minlength="8" aria-describedby="password-error">
              <button type="button" class="pw-toggle" id="pw-toggle" aria-controls="clave" aria-pressed="false">Mostrar</button>
            </div>
            <p class="error" id="password-error" role="alert"></p>
          </div>

          <div class="form-aux">
            <label class="check"><input type="checkbox" id="recordar" name="remember"> Mantener sesión iniciada</label>
            <a class="link" href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="btnIngresar">Iniciar sesión</button>
        </form>
      </div>
    </main>

  </div>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  <script src="js/comun.js"></script>
    <script>
        // Si ya hay una sesión activa, entra directo al panel
        const previa = obtenerSesion();
        if (previa && previa.activo === true) window.location.replace("dashboard.html");

        // Mostrar / ocultar contraseña
        const pwToggle = document.getElementById("pw-toggle");
        pwToggle.addEventListener("click", () => {
            const campo = document.getElementById("clave");
            const visible = campo.type === "text";
            campo.type = visible ? "password" : "text";
            pwToggle.textContent = visible ? "Mostrar" : "Ocultar";
            pwToggle.setAttribute("aria-pressed", String(!visible));
        });

        document.getElementById("formLogin").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btnIngresar");
            btn.disabled = true;

            try {
                const usuario = await api("/login", "POST", {
                    usuario: document.getElementById("usuario").value.trim(),
                    clave: document.getElementById("clave").value
                });

                // Guarda la sesión: en localStorage si marcó "Mantener sesión iniciada", si no en sessionStorage
                guardarSesion(usuario, document.getElementById("recordar").checked);
                window.location.href = "dashboard.html";
            } catch (error) {
                mostrarAlerta(error.message, "danger");
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
