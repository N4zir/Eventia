<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistentes | Eventia</title>
  <meta name="theme-color" content="#15181b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E8601C'/%3E%3Cpath d='M10 9h12v3H13.5v2.5H21v3h-7.5V20H22v3H10z' fill='%230e1012'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <header class="topbar" id="topbar"></header>
        <main class="content">
            <div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <h1 class="page-title">Gestión de asistentes</h1>
                    <p class="page-subtitle mb-0">Registro, consulta y administración de asistentes.</p>
                </div>
                <button type="button" class="btn btn-eventia btn-sm px-3" id="btnNuevoAsistente">
                    <i class="bi bi-plus-lg me-1"></i> Nuevo asistente
                </button>
            </div>

            <div id="alerta" aria-live="polite"></div>

            <div class="row g-3 mb-4">
                <div class="col-12 col-md-6 col-xl-4">
                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="bi bi-people"></i></div>
                        <div>
                            <p class="kpi-label">Asistentes registrados</p>
                            <p class="kpi-value" id="totalAsistentes">—</p>
                            <span class="kpi-delta">Registros en el sistema</span>
                        </div>
                    </div>
                </div>
            </div>

            <section class="panel-card mb-4" id="panelFormulario">
                <div class="panel-header d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h2 class="panel-title" id="tituloFormulario">Registrar asistente</h2>
                        <p class="panel-subtitle mb-0">Completa los datos solicitados.</p>
                    </div>
                    <span class="kpi-icon"><i class="bi bi-person-vcard"></i></span>
                </div>

                <form id="formAsistente" class="row g-3">
                    <input type="hidden" id="asistenteId">
                    <div class="col-12 col-md-4">
                        <label class="form-label" for="cNombre">Nombre completo</label>
                        <input type="text" class="form-control" id="cNombre" maxlength="100" required>
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label" for="cCorreo">Correo</label>
                        <input type="text" class="form-control" id="cCorreo" maxlength="100" required>
                    </div>
                    <div class="col-12 d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-eventia px-3" id="btnGuardarAsistente">
                            <i class="bi bi-check-lg me-1"></i> Guardar asistente
                        </button>
                        <button type="button" class="btn btn-outline-secondary px-3" id="btnLimpiar">
                            Limpiar
                        </button>
                    </div>
                </form>
            </section>

            <section class="panel-card">
                <div class="panel-header d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <div>
                        <h2 class="panel-title">Listado de asistentes</h2>
                        <p class="panel-subtitle mb-0">Asistentes registrados en la base de datos.</p>
                    </div>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="btnActualizar">
                        <i class="bi bi-arrow-clockwise me-1"></i> Actualizar
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="table table-custom align-middle mb-0">
                        <thead>
                            <tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="tablaAsistentes">
                            <tr><td colspan="4" class="text-center text-muted py-4">Cargando asistentes...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
<div class="sidebar-overlay" id="overlay"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/comun.js"></script>
<script>
let asistentes = [];

document.addEventListener("DOMContentLoaded", () => {
    const sesion = montarLayout("asistentes", "Buscar asistente...");
    if (!sesion) return;
    document.getElementById("formAsistente").addEventListener("submit", guardarAsistente);
    document.getElementById("btnLimpiar").addEventListener("click", limpiarFormulario);
    document.getElementById("btnActualizar").addEventListener("click", cargarAsistentes);
    document.getElementById("btnNuevoAsistente").addEventListener("click", () => {
        limpiarFormulario();
        document.getElementById("cNombre").focus();
    });
    cargarAsistentes();
});

async function cargarAsistentes() {
    const tbody = document.getElementById("tablaAsistentes");
    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">Cargando asistentes...</td></tr>';
    try {
        const resultado = await api("/asistentes", "GET", null, API_ASISTENTES);
        if (!Array.isArray(resultado)) throw new Error("La API no devolvió una lista válida de asistentes.");
        asistentes = resultado;
        document.getElementById("totalAsistentes").textContent = asistentes.length;
        if (!asistentes.length) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">No hay asistentes registrados.</td></tr>';
            return;
        }
        tbody.innerHTML = asistentes.map(c => `
            <tr>
                <td>${Number(c.id)}</td>
                <td class="fw-medium">${esc(c.nombre)}</td>
                <td>${esc(c.correo)}</td>
                <td class="text-nowrap">
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="editarAsistente(${Number(c.id)})"><i class="bi bi-pencil"></i> Editar</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="eliminarAsistente(${Number(c.id)})"><i class="bi bi-trash"></i> Eliminar</button>
                </td>
            </tr>`).join("");
    } catch (error) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">No se pudieron cargar los asistentes.</td></tr>';
        mostrarAlerta(error.message, "danger");
    }
    aplicarBusqueda();
}

function editarAsistente(id) {
    const c = asistentes.find(x => Number(x.id) === Number(id));
    if (!c) return;
    document.getElementById("asistenteId").value = c.id;
    document.getElementById("cNombre").value = c.nombre || "";
    document.getElementById("cCorreo").value = c.correo || "";
    document.getElementById("tituloFormulario").textContent = "Editar asistente";
    document.getElementById("btnGuardarAsistente").innerHTML = '<i class="bi bi-check-lg me-1"></i> Actualizar asistente';
    document.getElementById("panelFormulario").scrollIntoView({ behavior: "smooth" });
}

function limpiarFormulario() {
    document.getElementById("formAsistente").reset();
    document.getElementById("asistenteId").value = "";
    document.getElementById("tituloFormulario").textContent = "Registrar asistente";
    document.getElementById("btnGuardarAsistente").innerHTML = '<i class="bi bi-check-lg me-1"></i> Guardar asistente';
}

async function guardarAsistente(e) {
    e.preventDefault();
    const id = document.getElementById("asistenteId").value;
    const datos = {
        nombre: document.getElementById("cNombre").value.trim(),
        correo: document.getElementById("cCorreo").value.trim(),
    };
    if (!datos.nombre || !datos.correo) {
        mostrarAlerta("Nombre y correo son obligatorios.", "warning");
        return;
    }
    const boton = document.getElementById("btnGuardarAsistente");
    boton.disabled = true;
    try {
        if (id) {
            await api("/asistentes/" + encodeURIComponent(id), "PUT", datos, API_ASISTENTES);
            mostrarAlerta("Asistente actualizado correctamente.", "success");
        } else {
            await api("/asistentes", "POST", datos, API_ASISTENTES);
            mostrarAlerta("Asistente registrado correctamente.", "success");
        }
        limpiarFormulario();
        await cargarAsistentes();
    } catch (error) {
        mostrarAlerta(error.message, "danger");
    } finally {
        boton.disabled = false;
    }
}

async function eliminarAsistente(id) {
    if (!confirm("¿Deseas eliminar este asistente? Si tiene registros relacionados, SQL Server puede impedir la eliminación.")) return;
    try {
        await api("/asistentes/" + encodeURIComponent(id), "DELETE", null, API_ASISTENTES);
        mostrarAlerta("Asistente eliminado correctamente.", "success");
        await cargarAsistentes();
    } catch (error) {
        mostrarAlerta(error.message, "danger");
    }
}
</script>
</body>
</html>
